server:
  port: 8080

spring:
  application:
    name: task-harbor
  config:
    activate:
      on-profile: prod

  r2dbc:
    url: ${DB_R2DBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 20
      max-size: 200
      max-life-time: 30m
      max-idle-time: 10m

  flyway:
    enabled: true
    url: ${DB_HOST_FLYWAY}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST_PROD}
      port: ${SPRING_DATA_REDIS_PORT_PROD}
      username: ${SPRING_DATA_REDIS_USERNAME_PROD}
      password: ${SPRING_DATA_REDIS_PASSWORD_PROD}
      database: ${SPRING_DATA_REDIS_DATABASE_PROD}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT_PROD}
      client-name: ${SPRING_DATA_REDIS_CLIENT_NAME_PROD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED_PROD}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE_PROD}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE_PROD}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE_PROD}
          max-wait: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT_PROD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.taskharbor: INFO
    org.springframework: WARN
    org.hibernate: WARN
  logstash:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
